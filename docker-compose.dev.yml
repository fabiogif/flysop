version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: soprender-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            mysql:
                condition: service_healthy
            minio:
                condition: service_started
            redis:
                condition: service_healthy
            soketi:
                condition: service_started
        env_file:
            - .env
        # DB_* vêm do .env (Supabase ou local). Para Postgres local: DB_HOST=pgsql, DB_PORT=5432, etc.
        ports:
            - '0.0.0.0:8010:8000'
        command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction; fi && php artisan migrate --force || true && php artisan serve --host=0.0.0.0 --port=8000"

    queue:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: soprender-queue
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
            pgsql:
                condition: service_healthy
        env_file:
            - .env
        # Worker separado do processo web (Fase 0): QUEUE_CONNECTION=redis exige um consumidor rodando.
        command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction; fi && php artisan queue:work redis --tries=3 --sleep=3"

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: soprender-scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
        env_file:
            - .env
        # Sem isso, nenhum Schedule::command() em app/Console/Kernel.php roda (Fase 3): nem a
        # limpeza de driver_positions nem a checagem de SLA. Loop simples de 1 min — sem cron no container.
        command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction; fi && while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

    nginx:
        image: nginx:alpine
        container_name: soprender-nginx
        restart: unless-stopped
        ports:
            - '80:80'
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - sail
        depends_on:
            - app

    minio:
        image: 'minio/minio:latest'
        restart: unless-stopped
        ports:
            - '9001:9000'
            - '8900:8900'
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: password
        command: 'minio server /data/minio --console-address ":8900"'
        volumes:
            - minio-data:/data/minio
        healthcheck:
            test:
                - CMD
                - curl
                - '-f'
                - 'http://localhost:9000/minio/health/live'
            retries: 3
            timeout: 5s
        networks:
            - sail

    pgsql:
        image: 'postgres:15'
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-laravel}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-laravel}'
                - '-U'
                - '${DB_USERNAME:-laravel}'
            retries: 3
            timeout: 5s

    mysql:
        image: 'mysql/mysql-server:8.0'
        restart: unless-stopped
        ports:
            - '3307:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD:-secret}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:7-alpine'
        container_name: soprender-redis
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    # Soketi: servidor WebSocket self-hosted compatível com o protocolo Pusher (Fase 0 — broadcasting real).
    soketi:
        image: 'quay.io/soketi/soketi:1.6-16-alpine'
        container_name: soprender-soketi
        restart: unless-stopped
        environment:
            SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID:-flysop}'
            SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY:-flysopkey}'
            SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET:-flysopsecret}'
        ports:
            - '6001:6001'
        networks:
            - sail

volumes:
    sail-pgsql:
        driver: local
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    minio-data:
        driver: local

networks:
    sail:
        driver: bridge
        enable_ipv6: false
