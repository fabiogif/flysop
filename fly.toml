# fly.io – https://fly.io/docs/reference/configuration/
# Nome do app (obrigatório): use o que foi criado em fly launch ou escolha um único
app = "flysop"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"

  
[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"