# fly.toml app configuration file generated for flysop on 2026-09-09T19:23:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "flysop"
primary_region = 'gru'
kill_signal = 'SIGINT'
kill_timeout = '10s'
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = 'php artisan migrate --force'

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  # Use a URL real do app (troque flysop pelo nome do seu app)
  APP_URL = "https://flysop.fly.dev"
  # Cookie de sessão via HTTPS (obrigatório para login no fly.io)
  SESSION_SECURE_COOKIE = "true"
  # Sessão no cooki1e evita 419 quando não há Redis/DB de sessão no fly.io
  SESSION_DRIVER = "cookie"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
