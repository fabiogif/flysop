# fly.toml app configuration file generated for flysop-calm-hollow-9541 on 2026-10-20T15:13:54-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flysop-calm-hollow-9541'
primary_region = 'gru'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    # 8.2: o código usa match, nullsafe (?->) e promoção de propriedades (PHP 8+)
    PHP_VERSION = '8.2'

[deploy]
  # Roda as migrations antes de liberar a nova versão
  release_command = 'php artisan migrate --force'

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
