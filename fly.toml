# fly.io – use Dockerfile.fly (PHP 8.2 oficial, evita 404 em apt)
# Gere com: fly launch (ou edite app name abaixo)

app = "soprender"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
